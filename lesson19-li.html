<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="lesson19-li.css">
    <title></title>
    <style></style>
</head>

<body>

    <div id="myForm">
        <form>
           <label for="username">Username: </label>
           <input type="text" name="username" value="" id="username" class="username">
           
           <label for="email">Email: </label>
           <input type="email" name="email" value="" id="email" class="email">

           <label for="password">Password: </label>
           <input type="password" name="password" value="" id="password" class="password">
            
           <label for="country">Country: </label>
           <select id="country">
                <option value="hk">Hong Kong</option>
                <option value="us">United States</option>
            </select>
           
           <br> 

           <label for="agree"> Do you agree: </label>
           <input type="checkbox" name="agree" value="" id="agree" class="agree">

           <label for="gender">Gender: </label>
           <input type="radio" name="gender" value="" id="gender" class="gender">
            
        </form>
    </div>

    

    <script src="lesson19-li.js">
    </script>
</body>

</html>
