<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        /* 第 3 題：閱讀角標題及內容卡片 */
        h2 {
            font-size: 26px;
            color: #264653;
            background-color: #e9f5f2;
            font-weight: 700; 
        }

        .book-card {
            color: black;
        }

        article {
            color: black;
        }


        /* 第 4 題：閱讀角標題及內容卡片 */
        .information-box {
            width: 280px;
            padding: 16px;
            border: 2px solid #457b9d;
            margin-top: 20px;
            margin-bottom: 20px;
            margin: 0 auto;
            border-radius: 10px;
        }

        /* 第 8 題：加入連結滑鼠效果 */

        .room-link {
            color: #1d3557;
            text-decoration: none;

        }

        .room-link:hover {
            background-color: #a8dadc;
            border-radius: 6px;
        }


        /* 第 9 題：活動室背景圖案 */
        .background {
            background-image: url('room-pattern.svg');
            background-repeat: repeat-y;
            background-position: 80%;
            background-color: #f5f1e8;
            background-attachment: fixed;
        }


        /* 第 13 題：服務資訊連結 */
        .service-links ul {
            display: flex;
            justify-content: space-evenly;
            list-style-type: none; 
            margin: 0;
            padding: 0;
            background-color: #31572c;
        }

        .service-links li { 
            margin-right: 18px;
        }

        .service-links a { 
            color: white; 
            padding: 10px 12px;
            display: block;
            text-decoration: none;
        }



        /* // 第 15A 題： 兩種編號次序 */

        .notice-grid { 
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px;
        }

        @media (max-width: 600px){
            .notice-grid {
                flex-direction: column;
            }
        }



    </style>
</head>

<body>

    <!-- 第 1 題：加入新的到訪提示 -->
    <button onclick="addArrivalNote()">加入到訪提示</button>
    <ul id="arrivalNotes"></ul>

    <!-- 第 2 題：製作開放時間表 -->
    <table border="1">
        <thead>
            <tr>
                <th>日期</th>
                <th>開放時間</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>星期一</td>
                <td>上午九時至下午六時</td>
            </tr>
            <tr>
                <td>星期六</td>
                <td>上午十時至下午四時</td>
            </tr>

        </tbody>
    </table>


    <!-- 第 3 題：閱讀角標題及內容卡片 -->
    <h2>社區閱讀角</h2>
    <section class="shelf">
        <article class="book-card">本月新書</article>
        <article class="book-card">兒童讀物</article>
        <article class="book-card">報章雜誌</article>
    </section>

    <!-- 第 4 題：設定資訊方格的盒模型 -->

    <div class="information-box">活動開始前十五分鐘開放入場。</div>


    <!-- 第 7 題：標示所有開放時段 -->
    <p>今日開放時段：</p>
    <span>上午九時</span>
    <span>上午十一時</span>
    <span>下午二時</span>
    <span>下午四時</span>
    <button onclick="emphasizeTimes()">標示時段</button>

    <!-- 第 8 題：加入連結滑鼠效果 -->
    <a class="room-link" href="#studio">查看創作室</a>


    <!-- 第 11 題：確認預約狀態 -->

    <div id="bookingStatus" style="border:2pxsolid#cccccc;background-color:#6c757d;">
        預約尚未確認
    </div>
    <button onclick="confirmBooking()">確認預約</button>

    <!-- 第 12 題：建立活動報名表單 -->

    <form>
        <label for="participantName">參加者姓名</label>
        <input type="text" id="participantName" />

        <select>
            <option>上午場</option>
            <option>下午場</option>
        </select>

        <button type="submit">送出登記</button>
    </form>


    <!-- 第 13 題：服務資訊連結 -->

    <div class="service-links">
        <ul>
            <li><a href="#hours">開放時間</a></li>
            <li><a href="#rooms">活動室</a></li>
            <li><a href="#contact">聯絡方法</a></li>
        </ul>
    </div>

    <!-- 第 14 題： 計算場地費⽤ -->

    

    <script>
        // 第 1 題：加入新的到訪提示
        function addArrivalNote() {
            const ul = document.getElementById("arrivalNotes");
            const list = document.createElement("li");

            list.textContent = "請先到接待處領取號碼牌。";
            ul.appendChild(list);

        }

        // 第 5 題：活動室陣列
        let activityRooms = [
            "棋藝室",
            "舞蹈室",
            "閱讀室",
            "多用途室"  
        ];

        activityRooms[1];
        // output: 舞蹈室

        let computerRoom = "電腦室";
        activityRooms.push(computerRoom);
        
        for(let i = 0; i < activityRooms.length; i++){
            console.log(activityRooms[i]);
        }


        // 第 6 題：判斷登記方式
        let visitorCount = 7;
        let registrationType = "";

        if (visitorCount >= 6) {
            registrationType = "個別登記";
            console.log(registrationType);
        } else {
            console.log(registrationType);
        }

        // 第 7 題：標示所有開放時段

        function emphasizeTimes() {
            const tagElement = document.getElementsByTagName("span");
            console.log(tagElement);
            for(let i = 0; i < tagElement.length; i++) {
                tagElement[i].style.fontWeight = "700";
                tagElement[i].style.borderBottom = "solid";
            }
        }

        // 第 10 題：讀取及修改物件資料

        let centreRoom = {
            name: "創意室",
            floor: 2,
            seats: 18
        }

        centreRoom.floor
        //output: 2

        centreRoom.seats = 20;
        console.log(centreRoom.seats);

        centreRoom.available = true;


        // 第 11 題：確認預約狀態
        function confirmBooking() {
            const bookingStatus = document.getElementById("bookingStatus");

            bookingStatus.textContent = "預約已經確認";
            bookingStatus.style.color = "#ffffff";
            bookingStatus.style.borderColor = "#15616d";
            bookingStatus.style.fontSize = "20px";
        }


        // 第 14 題： 計算場地費⽤

        function calculateVenueFee(hours, hourlyRate) {
            return hours * hourlyRate;
        }

        console.log(calculateVenueFee(3, 25));


        // 第 15A 題： 兩種編號次序

        for (let i = 2; i <= 14; i += 4){
            console.log(i);
        }

        // 第 15B 題： 兩種編號次序

        let i = 14;
        do {
            console.log(i);
            i -= 4;
        } while (i >=2)

    </script>
</body>

</html>
