<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React on a Single Webpage</title>

    
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
    </style>
</head>
<body>

    
    <div id="root"></div>



    
    <script type="text/babel">
        const root = ReactDOM.createRoot(document.getElementById("root"));
        const { useState } = React;
        
        
        function App() {
            
            function Hello() {
                return "Hello! classmate";
            }

            function add(a, b) {
                return a+b;
            }

            function subtract(a, b) {
                return a-b;
            }
            
            function Calculator_addition(props) {
                return add(props.value1, props.value2);
            }

            function Calculator_subtraction(props) {
                return subtract(props.value1, props.value2);
            }
            
               
            
            return (
                <>
                  <Hello />
                  <br />
                  <Calculator_addition value1= {20} value2={40} />
                  <br />
                  <Calculator_subtraction value1= {20} value2={40} />
                </>
            )
        }

        root.render(<App />);
    </script>

</body>
</html>
